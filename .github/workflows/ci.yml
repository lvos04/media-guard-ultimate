# MediaGuard Ultimate — CI
#
# push/PR: core, encoder unit tests (zonder toolchain), web (Peil-driftcontrole, lint/typecheck/unit/build/e2e),
# kopieën van contract en Peil tegen hun gepinde bron (C1.3-MGU-01) en het upgradebewijs van de HARDE EIS
# (vorige release → core van deze commit op een gevulde database, C1.3-MGU-03).
# Nightly (03:17 UTC) + handmatig: encoder-suite in het toolchain-image (--target test),
# beide fork-images bouwen en de upstream-sync van de forks in rapportmodus.
# release.yml roept deze workflow aan (workflow_call): zonder groene tests geen release.
# Niets in deze workflow pusht images of wijzigt de repo; publiceren: release.yml.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      heavy:
        description: "Ook zware jobs (encoder-image, fork-images, upstream-sync) draaien"
        type: boolean
        default: true
  # vanuit release.yml: alleen core, encoder-unit en web (de zware jobs vragen
  # github.event_name 'schedule' of 'workflow_dispatch' met heavy=true)
  workflow_call:
    inputs:
      heavy:
        type: boolean
        default: false
      # release.yml draait het upgradebewijs zelf op het echte kandidaat-image (job upgradebewijs)
      upgradebewijs:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_HDR10PLUS_VERSION: "8.1.3"
  FFMPEG_HDR10PLUS_SHA256: "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"

jobs:
  # 3.12 = het losse core-image (apps/core/Dockerfile); 3.14 = het alles-in-één-image, waar
  # core op de Python van het encode-image draait (deploy/release-manifest.json,
  # toolchain.encode.python). test_release_pipeline.py bewaakt dat die twee overeenkomen.
  core:
    name: core (python ${{ matrix.python }}, ruff, pytest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/core/pyproject.toml
      - name: ffprobe/mediainfo (lichte analyse in core-tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mediainfo
      - run: pip install -e "apps/core[test]"
      - name: ruff
        working-directory: apps/core
        run: ruff check .
      - name: pytest
        working-directory: apps/core
        run: python -m pytest -q -rfEs -p no:cacheprovider

  # Contract 1.3 (kop, §10; C1.3-MGU-01) en Peil 1.1.1 (ONTWERPTAAL §14, E08): byte-gelijke kopieën met gepinde
  # bron-commit. Fout bij een afwijking van de bron op de gepinde commit (en bij Peil: zelfde versie, andere inhoud);
  # een nieuwere bron is een waarschuwing (bewust bijwerken). De offline controle draait ook in de core-tests.
  kopieen:
    name: kopieën contract en Peil (gepinde bron-commit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: offline (koppen, sha256, HERKOMST.json)
        run: python3 scripts/kopie-herkomst.py controleer
      - name: tegen lvos04/ai-server-manager op GitHub (gepinde commit + werkbranch)
        run: python3 scripts/kopie-herkomst.py vergelijk --online

  # HARDE EIS (contract 1.3 §2.3 regel 7b, §12; C1.3-MGU-03): kijkgeschiedenis en MediaGuard-voortgang blijven altijd
  # beschikbaar. Op elke push: de echte vorige release (op digest) start op de gevulde fixture, daarna de runtime van die
  # release met de core van deze commit (deploy/upgradebewijs/Dockerfile.kandidaat); per tabel vóór/na vergelijken,
  # readback via de API en terugzetten (vorige image + snapshot). Het releasebewijs met het echte kandidaat-image draait
  # in release.yml vóór publish.
  upgradebewijs:
    name: upgradebewijs (vorige release → core van deze commit)
    if: github.event_name != 'schedule' && inputs.upgradebewijs != false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: vorige release (op digest) ophalen en core-kandidaat bouwen
        run: |
          VORIGE="$(python3 -c 'import json;d=json.load(open("deploy/upgradebewijs/vorige-release.json"));print(d["image"]+"@"+d["digest"])')"
          VORIGE_VERSIE="$(python3 -c 'import json;print(json.load(open("deploy/upgradebewijs/vorige-release.json"))["versie"])')"
          VERSIE="$(python3 -c 'import json;print(json.load(open("deploy/release-manifest.json"))["version"])')"
          { echo "VORIGE=$VORIGE"; echo "VORIGE_VERSIE=$VORIGE_VERSIE"; echo "VERSIE=$VERSIE"; } >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do docker pull -q "$VORIGE" && break; sleep $((2 ** i)); done
          docker buildx build --load -f deploy/upgradebewijs/Dockerfile.kandidaat \
            --build-context core=apps/core --build-context release=deploy \
            --build-arg "VORIGE=$VORIGE" -t mediaguard/upgrade-kandidaat:ci deploy/upgradebewijs
      - name: upgradebewijs (start, meten, upgraden, vergelijken, terugzetten)
        run: >-
          python3 scripts/upgradebewijs.py poort --vorige "$VORIGE" --vorige-versie "$VORIGE_VERSIE"
          --nieuw mediaguard/upgrade-kandidaat:ci --versie "$VERSIE"
          --werkmap "$RUNNER_TEMP/upgradebewijs" --rapport "$RUNNER_TEMP/upgradebewijs.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgradebewijs-rapport
          path: ${{ runner.temp }}/upgradebewijs.md
          retention-days: 30

  encoder-unit:
    name: encoder unit (zonder toolchain)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # zelfde Python als het encode- en alles-in-één-image (Ubuntu 26.04)
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/encoder/pyproject.toml
      # Ubuntu 24.04: FFmpeg 6.1 met libsvtav1; geen dovi_tool/mkvmerge/FFmpeg ≥ 7.1.
      # Daarom alleen de suites die geen DV-/HDR10+-fixtures of echte encodes vragen.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg acl
      - run: pip install -e "services/encoder[test]"
      - name: ruff + mypy
        working-directory: services/encoder
        run: ruff check app tests && mypy app
      - name: pytest (subset)
        working-directory: services/encoder
        run: >-
          python -m pytest -q -rfEs -p no:cacheprovider
          tests/test_mediaguard_policy.py tests/test_beslissen.py tests/test_bestandsfilter.py
          tests/test_db.py tests/test_opslag.py tests/test_onderhoud.py
          tests/test_mediaguard_storage_guard.py tests/test_scanscheduler.py
          tests/test_smb_helper.py tests/test_ai_controller.py tests/test_integraties.py
          tests/test_verificatie.py tests/test_systeem.py

  encoder-image:
    name: encoder volledige suite in toolchain-image (traag)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.heavy)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: FFmpeg-bron (gepinde sha256)
        run: |
          mkdir -p /tmp/ffmpeg-src
          curl -fsSL --retry 5 -o "/tmp/ffmpeg-src/ffmpeg-${FFMPEG_HDR10PLUS_VERSION}.tar.xz" \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_HDR10PLUS_VERSION}.tar.xz"
          echo "${FFMPEG_HDR10PLUS_SHA256}  /tmp/ffmpeg-src/ffmpeg-${FFMPEG_HDR10PLUS_VERSION}.tar.xz" | sha256sum -c -
      - name: build --target test
        run: |
          docker buildx build --load --target test \
            --build-context ffmpeg-src=/tmp/ffmpeg-src \
            -t mediaguard/encode:test services/encoder
      - name: pytest + ruff + mypy in het image
        run: |
          docker run --rm mediaguard/encode:test python3 -m pytest -q -rfEs -p no:cacheprovider
          docker run --rm mediaguard/encode:test sh -c "ruff check app tests && mypy app"

  web:
    name: web (node 22, lint, typecheck, build, e2e)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: core voor e2e (echte core, geen mocks)
        run: |
          python -m venv /tmp/corevenv
          /tmp/corevenv/bin/pip install -e apps/core
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Peil-kopieën ongewijzigd (versie + sha256, O-14)
        run: npm run check:peil
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - name: unit-tests web (vitest)
        run: npm run test:unit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: e2e (playwright start core + web zelf, zie playwright.config.ts)
        working-directory: apps/web
        env:
          MG_E2E_PYTHON: /tmp/corevenv/bin/python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/e2e/.results
          retention-days: 7
          # de map begint met een punt: zonder dit wordt hij overgeslagen
          include-hidden-files: true

  forks:
    name: fork-images bouwen (${{ matrix.app }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.heavy)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: [sonarr, radarr]
    steps:
      - uses: actions/checkout@v4
      - name: build runtime-image uit gepinde upstream-SHA + patches
        run: forks/${{ matrix.app }}/build.sh
      - name: unit tests (MediaGuard + decision/import engines)
        run: forks/${{ matrix.app }}/build.sh --target unittest

  upstream-sync:
    name: upstream-sync rapport (${{ matrix.app }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.heavy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [sonarr, radarr]
    steps:
      - uses: actions/checkout@v4
      - name: sync-upstream.sh (rapportmodus, wijzigt niets)
        run: forks/${{ matrix.app }}/sync-upstream.sh --out "$RUNNER_TEMP/sync-${{ matrix.app }}"
      - name: rapport in job-samenvatting
        if: always()
        run: cat "$RUNNER_TEMP/sync-${{ matrix.app }}/REPORT.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-sync-${{ matrix.app }}
          path: ${{ runner.temp }}/sync-${{ matrix.app }}
          retention-days: 14
