# Android-app (apps/android): bouwt de APK.
# - push (elke branch) of een PR die apps/android raakt: Peil-tokens controleren, unit-tests en de
#   schermafdrukken vergelijken (Paparazzi, verifyPaparazziDebug), debug + release bouwen, APK als artifact
# - nadat de workflow "release" geslaagd is (tag v<versie> bestaat dan): release-APK als
#   mediaguard-android-<versie>.apk aan de GitHub-release v<versie> hangen (release wordt
#   aangemaakt als die nog niet bestaat)
# Versienummer: versionCode = versie*100 + bouwnummer (commits sinds de versiewijziging,
# scripts/android-build-number.sh). Zo is een handmatige build (workflow_dispatch) altijd een
# update voor Android/Obtainium en blijven release-builds oplopend (docs/ANDROID.md).
# Ondertekening: zet de secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS en ANDROID_KEY_PASSWORD voor een eigen sleutel. Zonder die secrets wordt de
# release-APK ondertekend met de vaste, niet-geheime sideload-sleutel uit apps/android/signing,
# zodat updates gewoon werken (zie docs/ANDROID.md).
name: android

on:
  push:
    branches: ["**"]
    paths: ["apps/android/**", "design/ontwerptaal/tokens.json", "deploy/release-manifest.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "design/ontwerptaal/tokens.json", ".github/workflows/android.yml"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # volledige historie: het bouwnummer telt commits sinds de versiewijziging
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # standaard vraagt de action ook het verdwenen pakket 'tools'; alleen wat we gebruiken
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: versie en bouwnummer
        id: v
        working-directory: .
        run: |
          V="$(python3 -c 'import json;print(json.load(open("deploy/release-manifest.json"))["version"])')"
          N="$(scripts/android-build-number.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MG_ANDROID_BUILD=$N" >> "$GITHUB_ENV"
          # na de workflow 'release' heet de app gewoon <versie>; anders <versie>+<bouwnummer>
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then echo "MG_ANDROID_RELEASE=1" >> "$GITHUB_ENV"; fi
          echo "::notice::Android ${V}, bouwnummer ${N} (versionCode = versie*100 + ${N})"
      - name: ondertekensleutel (optioneel)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MG_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Geen ANDROID_KEYSTORE_BASE64-secret: release-APK wordt met de vaste sideload-sleutel ondertekend."
          fi
      # Peil: de kleuren van de app komen uit de gepinde design/ontwerptaal/tokens.json (ADR-0018)
      - name: Peil-tokens actueel
        run: python3 tools/peil_tokens.py --check
      # verifyPaparazziDebug draait alle unit-tests en vergelijkt de schermafdrukken (licht/donker, 360/393 dp,
      # grote letter) met app/src/test/snapshots/images
      - name: tests, schermafdrukken en build
        env:
          MG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MG_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MG_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:verifyPaparazziDebug :app:assembleDebug :app:assembleRelease
      - name: testrapport en afwijkende schermafdrukken
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-testrapport
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/paparazzi/failures/
          if-no-files-found: ignore
      - name: APK hernoemen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mediaguard-android-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mediaguard-android-${{ steps.v.outputs.version }}
          path: apps/android/out/*.apk
      - name: aan de GitHub-release hangen
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="v${{ steps.v.outputs.version }}"
          if ! gh release view "$T" >/dev/null 2>&1; then
            gh release create "$T" --verify-tag --title "MediaGuard Ultimate ${{ steps.v.outputs.version }}" \
              --notes "Zie CHANGELOG.md. Android-app: mediaguard-android-${{ steps.v.outputs.version }}.apk"
          fi
          gh release upload "$T" "out/mediaguard-android-${{ steps.v.outputs.version }}.apk" --clobber
