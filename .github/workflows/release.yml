# De vier bouwonderdelen blijven in tijdelijke workflowartefacten. Alleen de geteste
# alles-in-één-image krijgt na het upgradebewijs een publieke versietag.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-mediaguard-ghcr
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lvos04/mediaguard-core
  FFMPEG_HDR10PLUS_VERSION: "8.1.3"
  FFMPEG_HDR10PLUS_SHA256: "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"

jobs:
  meta:
    name: Versie en vorige release controleren
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          VERSION="$(cat VERSION)"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          jq -e --arg v "$VERSION" --arg image "$IMAGE" \
            '.version == $v and .images.aio.tag == ($v + "-aio") and .images.aio.image == $image' \
            deploy/release-manifest.json
          python3 scripts/upgradebewijs.py volgorde
          rc=0; scripts/image-tag-exists.sh "$IMAGE:$VERSION-aio" || rc=$?
          case "$rc" in
            1) echo "version=$VERSION" >> "$GITHUB_OUTPUT" ;;
            0) echo "::error::De versietag bestaat al."; exit 1 ;;
            *) echo "::error::De beschikbaarheid van de versietag is onbekend."; exit 1 ;;
          esac

  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    with:
      upgradebewijs: false

  app-images:
    name: Bouwonderdeel ${{ matrix.name }}
    needs: [meta, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        name: [web, encode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Onderdeel bouwen en bewaren
        env:
          APP: ${{ matrix.name }}
        run: |
          scripts/build-all.sh --only "$APP" --tag bouw
          docker save "mediaguard/$APP:bouw" | zstd -T2 -1 -o "$RUNNER_TEMP/$APP.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bouw-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  fork-images:
    name: Bouwonderdeel ${{ matrix.app }}-fork
    needs: [meta, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        app: [sonarr, radarr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fork uit gepinde bron en patches bouwen
        env:
          APP: ${{ matrix.app }}
        run: |
          scripts/build-all.sh --only "$APP"
          tag="$(jq -er --arg naam "$APP-fork" '.images[$naam].tag' deploy/release-manifest.json)"
          docker tag "mediaguard/$APP-fork:$tag" "mediaguard/$APP-fork:bouw"
          docker save "mediaguard/$APP-fork:bouw" | zstd -T2 -1 -o "$RUNNER_TEMP/$APP.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bouw-${{ matrix.app }}
          path: ${{ runner.temp }}/${{ matrix.app }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  aio-image:
    name: Custom App bouwen
    needs: [meta, app-images, fork-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.kandidaat.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bouw-*
          merge-multiple: true
          path: ${{ runner.temp }}/onderdelen
      - name: De vier bouwonderdelen laden
        run: |
          for app in web encode sonarr radarr; do
            zstd -dc "$RUNNER_TEMP/onderdelen/$app.tar.zst" | docker load
            rm "$RUNNER_TEMP/onderdelen/$app.tar.zst"
          done
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: default
          context: deploy/aio
          file: deploy/aio/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mediaguard/aio:bouw
          build-contexts: |
            core=apps/core
            release=deploy
          build-args: |
            ENCODE_IMAGE=mediaguard/encode:bouw
            WEB_IMAGE=mediaguard/web:bouw
            SONARR_IMAGE=mediaguard/sonarr-fork:bouw
            RADARR_IMAGE=mediaguard/radarr-fork:bouw
          labels: |
            org.opencontainers.image.title=MediaGuard Ultimate
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Kandidaat uitsluitend op digest beschikbaar maken
        id: kandidaat
        run: |
          if ! command -v skopeo >/dev/null; then sudo apt-get update && sudo apt-get install -y skopeo; fi
          bron="oci:$RUNNER_TEMP/aio:kandidaat"
          skopeo copy docker-daemon:mediaguard/aio:bouw "$bron"
          digest="sha256:$(skopeo inspect --raw "$bron" | sha256sum | cut -d' ' -f1)"
          skopeo copy --preserve-digests "$bron" "docker://$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  aio-smoke:
    name: Rooktest met beide gebruikersinstellingen
    needs: [meta, aio-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start, procesrechten, gezondheid en nette stop
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIGEST: ${{ needs.aio-image.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          python3 scripts/aio-smoke.py --image "$IMAGE@$DIGEST" --version "$VERSION"

  upgradebewijs:
    name: Gegevensbehoud en terugweg
    needs: [meta, aio-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vorige release, kandidaat en terugweg op de herstelset
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIGEST: ${{ needs.aio-image.outputs.digest }}
        run: |
          B=deploy/upgradebewijs/vorige-release.json
          python3 scripts/upgradebewijs.py volgorde --vorige-release "$B" --versie "$VERSION"
          vorige="$(jq -er '.image + "@" + .digest' "$B")"
          docker pull "$vorige"
          docker pull "$IMAGE@$DIGEST"
          python3 scripts/upgradebewijs.py poort --vorige "$vorige" --vorige-versie "$(jq -er .versie "$B")" \
            --nieuw "$IMAGE@$DIGEST" --versie "$VERSION" --werkmap "$RUNNER_TEMP/upgradeproef" \
            --rapport "$RUNNER_TEMP/upgradebewijs.md"
          python3 tests/upgradehistorie/controleer_rapport.py "$RUNNER_TEMP/upgradebewijs.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upgradebewijs
          path: ${{ runner.temp }}/upgradebewijs.md
          if-no-files-found: error

  release-bewijs:
    name: Registerdigest en SPDX
    needs: [meta, aio-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p release
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.aio-image.outputs.digest }}
          format: spdx-json
          output-file: release/aio.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Installatiereferentie vastleggen
        env:
          DIGEST: ${{ needs.aio-image.outputs.digest }}
        run: python3 scripts/release-bewijs.py --aio-digest "$DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bewijs
          path: release/
          if-no-files-found: error

  publish:
    name: Geteste image en releasebijlagen publiceren
    needs: [meta, tests, app-images, fork-images, aio-image, aio-smoke, upgradebewijs, release-bewijs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bewijs
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgradebewijs
          path: release
      - name: AIO op dezelfde digest publiceren
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIGEST: ${{ needs.aio-image.outputs.digest }}
        run: |
          jq -e --arg v "$VERSION" --arg p "$DIGEST" --arg image "$IMAGE" \
            '.version == $v and .image == $image and .tag == ($v + "-aio") and .digest == $p' release/digests.json
          ref="$IMAGE:$VERSION-aio"
          scripts/promote-image.sh "$IMAGE@$DIGEST" "$ref"
          test "$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -er .digest)" = "$DIGEST"
      - name: Bijlagen aan de bestaande Git-tag koppelen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bestanden=(release/digests.json release/aio.spdx.json release/upgradebewijs.md)
          if gh release view "$GITHUB_REF_NAME" --json assets,isDraft > "$RUNNER_TEMP/bijlagen.json"; then
            for bestand in "${bestanden[@]}"; do
              naam="${bestand##*/}"
              if jq -e --arg n "$naam" 'any(.assets[]; .name == $n)' "$RUNNER_TEMP/bijlagen.json" >/dev/null; then
                gh release download "$GITHUB_REF_NAME" --pattern "$naam" --output "$RUNNER_TEMP/$naam"
                cmp "$bestand" "$RUNNER_TEMP/$naam"
              else
                gh release upload "$GITHUB_REF_NAME" "$bestand"
              fi
            done
            if jq -e .isDraft "$RUNNER_TEMP/bijlagen.json" >/dev/null; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "MediaGuard $GITHUB_REF_NAME" \
              --notes "Bijwerken van een bestaande installatie: zie deploy/truenas/BIJWERKEN.md van deze tag." \
              "${bestanden[@]}"
          fi
