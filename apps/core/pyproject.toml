[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mediaguard-core"
version = "1.2.2"
description = "MediaGuard Ultimate core: orchestrator, policy engine, instance management, migration, recovery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
  "python-multipart>=0.0.20,<1",
  "segno>=1.6,<2",
]

[project.scripts]
# noodtoegang vanuit de container-shell (wachtwoord/2FA kwijt), zie docs/SECURITY.md
mediaguard-noodtoegang = "mediaguard.noodtoegang:main"

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "hypothesis>=6.100,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["mediaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["mediaguard"]
