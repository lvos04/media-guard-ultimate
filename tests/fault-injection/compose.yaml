# MediaGuard fault-injection harness: the REAL core image in both roles (core + recovery) against
# a SCRATCH library (test files generated by run.sh; never real media).
#
# Mounts in the recovery container:
#   /media/tv       host bind  .run/media/tv        (normal disk, same fs as quarantine-in-library)
#   /media/small    named tmpfs volume, 64 MiB      (disk-full scenarios; survives container restart)
#   /work/staging   host bind  .run/work/staging
#   /work/quarantine named tmpfs volume, 1200 MiB   (other device → cross-device copy path)
name: mgfault

x-core: &core
  image: ${MG_CORE_IMAGE:-mediaguard/core:dev}
  user: "568:568"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: "no"
  networks: [fault]

x-env: &env
  MG_DATA_DIR: /config
  MG_INTERNAL_TOKEN: fault-injection-internal-token-0123456789
  MG_LIBRARY_ROOTS: /media/tv,/media/small
  MG_STAGING_DIR: /work/staging
  MG_QUARANTINE_DIR: /work/quarantine
  MG_RECOVERY_URL: http://recovery:8100

services:
  core:
    <<: *core
    environment:
      <<: *env
      MG_ROLE: core
    volumes:
      - ./.run/appdata:/config
      - ./.run/work/staging:/work/staging:ro
      - quarantine:/work/quarantine:ro
      - ./.run/media/tv:/media/tv:ro
      - small:/media/small:ro
    ports: ["127.0.0.1:28200:8100"]

  recovery:
    <<: *core
    environment:
      <<: *env
      MG_ROLE: recovery
    depends_on:
      core: {condition: service_healthy}
    volumes:
      - ./.run/appdata:/config
      - ./.run/work/staging:/work/staging
      - quarantine:/work/quarantine
      - ./.run/media/tv:/media/tv
      - small:/media/small

volumes:
  small:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=64m,uid=568,gid=568,mode=0755"}
  quarantine:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=1200m,uid=568,gid=568,mode=0755"}

networks:
  fault:
